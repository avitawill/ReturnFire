<title>מבצע דגל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap">
<style>
/* Layout: full-bleed 3D battlefield canvas; status strip on top, thumb controls at the bottom, vehicle bay as a centred sheet. Single committed dark look. */
:root{
  --ink:#0f1c1f; --sea:#17525c; --panel:#0f1c1fe0; --line:#35494d;
  --paper:#ece4cf; --dim:#a9b3a6; --ours:#6f9bd4; --theirs:#e0563c; --gold:#f0c24a;
  --display:'Secular One','Arial Hebrew',Arial,sans-serif;
  --body:'Heebo','Arial Hebrew',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden}
#game{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#hud{position:absolute;inset:0 0 auto 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:176px}
.stat h2{font-family:var(--display);font-weight:400;font-size:17px;margin:0 0 6px;line-height:1}
.m{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;font-size:12px;color:var(--dim)}
.bar{height:7px;background:#263a3e;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--paper)}
.bar i.low{background:var(--theirs)}
#ammo{color:var(--paper);font-variant-numeric:tabular-nums;font-weight:500}
#mm{width:120px;height:70px;border:1px solid var(--line);border-radius:6px;background:var(--sea);image-rendering:pixelated}

#msg{position:absolute;top:104px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:7px 14px;font-size:14px;font-weight:500;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#msg.on{opacity:1}

#joy{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border:2px solid #ece4cf80;border-radius:50%;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#ece4cf8c}

#ctl{position:absolute;bottom:22px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
#ctl button{border-radius:50%;border:2px solid var(--paper);background:#0f1c1f99;font-family:var(--display);touch-action:none}
#bFire{width:88px;height:88px;font-size:22px;border-color:var(--theirs)}
#bFire.down{background:#ece4cf33}
#bMine{width:60px;height:60px;font-size:13px;line-height:1.1}

#menu{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;background:#0a1416b8;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#menu.end{place-items:end center;background:none}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.06em;color:var(--gold);font-weight:500}
.sheet h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1;margin:0;text-wrap:balance}
.sheet p{margin:0;font-size:15px;line-height:1.55;max-width:60ch}
#mF{color:var(--gold);font-weight:500}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:start;
  background:#1a2c30;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.card:hover:not(:disabled){border-color:var(--paper)}
.card:disabled{opacity:.38;cursor:not-allowed}
.card canvas{width:56px;height:44px;grid-row:1}
.card b{font-family:var(--display);font-weight:400;font-size:18px;display:flex;justify-content:space-between;gap:6px}
.card b span{font-family:var(--body);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.card small{grid-column:1/-1;font-size:12.5px;line-height:1.4;color:var(--dim);margin-top:6px}
#again{align-self:flex-start;background:var(--paper);color:var(--ink);border:0;border-radius:6px;padding:10px 22px;font-family:var(--display);font-size:18px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot p{font-size:12.5px;color:var(--dim)}
#snd{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
</style>

<div id="game" dir="rtl" lang="he">
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div class="stat">
      <h2 id="vName"></h2>
      <div class="m">
        <span>שריון</span><div class="bar"><i id="hpB"></i></div>
        <span>דלק</span><div class="bar"><i id="fuB"></i></div>
        <span>תחמושת</span><span id="ammo"></span>
      </div>
    </div>
    <canvas id="mm" width="192" height="112" aria-label="מפת האזור"></canvas>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="ctl" hidden>
    <button id="bMine" type="button" hidden>מוקש<br><span id="mineN"></span></button>
    <button id="bFire" type="button">אש</button>
  </div>
  <div id="menu">
    <div class="sheet">
      <p class="eyebrow" id="mEy"></p>
      <h1 id="mT"></h1>
      <p id="mS"></p>
      <p id="mF" hidden></p>
      <div id="cards"></div>
      <button id="again" type="button" hidden>משחק חדש</button>
      <div class="foot">
        <p>מגע: גרירה בצד שמאל לנסיעה, כפתור אש מימין. מקלדת: חצים, רווח לירי, M למוקש.</p>
        <button id="snd" type="button" aria-pressed="true">צליל פועל</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.documentElement.lang='he';
const $=id=>document.getElementById(id);
const T=32,W=96,H=56,WATER=0,GRASS=1,SAND=2,ROAD=3,BRIDGE=4,TREE=5,RUBBLE=6,PAD=7;
const PADX=12*T,PADY=28*T,G=6,FH=60;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const adiff=(a,b)=>{let d=(a-b)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;return d};
const hh=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches===true);

const V={
  heli:{name:'מסוק',hp:60,speed:200,turn:5,fuel:70,ammo:240,rate:.1,r:12,fly:true,role:'מהיר וטס מעל הכול. שריון דק ודלק מועט.'},
  tank:{name:'טנק',hp:160,speed:82,turn:3.2,fuel:200,ammo:40,rate:.9,r:12,role:'הצריח מכוון לבד. מפרק מבצרים וחומות.'},
  launcher:{name:'משגר',hp:200,speed:62,turn:2.6,fuel:200,ammo:20,mines:5,rate:1.5,r:12,role:'טילים מתבייתים נגד קרקע ואוויר, ומוקשים.'},
  jeep:{name:"ג'יפ",hp:45,speed:150,turn:5.5,fuel:150,ammo:150,rate:.16,r:9,role:'היחיד שנושא את הדגל. שוחה במים.'}
};
const PC={b:'#3f74b8',l:'#6f9bd4',d:'#1f3d66'},EC={b:'#b8452f',l:'#d9735c',d:'#6b2416'};

const cv=$('c');
const mmB=document.createElement('canvas');mmB.width=W;mmB.height=H;const mmBc=mmB.getContext('2d');
const mmc=$('mm').getContext('2d');
const map=new Uint8Array(W*H),block=new Int16Array(W*H);
let structs=[],enemies=[],bullets=[],parts=[],mines=[],player=null,fleet={},flag={},mode='menu';
let alarm=false,droneT=0,deadT=0,time=0,playT=0,shake=0,towersLeft=6,mmDirty=true,mmT=0,lostName='',fuelWarn=false;
let vw=800,vh=600,baseD=480;const cam={x:PADX,y:PADY,z:1};
const key={};let fireBtn=false,firePtr=null,mineReq=false;
const MFX=PADX-40,MFY=PADY-50;let myFlag={state:'home'},raidT=55,loseWhy='jeeps',slowT=0,orbit=true,camTh=0,camE=.7,winFx=0;const joy={id:null,ox:0,oy:0,vx:0,vy:0};

/* ---------- world ---------- */
function gen(){
  const r=rng(11);map.fill(WATER);block.fill(0);structs=[];enemies=[];
  const isl=[[15,28,12,14],[46,16,11,7],[48,41,12,7],[80,28,13,16]];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)for(const[cx,cy,rx,ry]of isl){
    const dx=(x-cx)/rx,dy=(y-cy)/ry,an=Math.atan2(dy,dx),w=1+.1*Math.sin(an*3+cx)+.06*Math.sin(an*7+cy);
    if(dx*dx+dy*dy<w*w){map[y*W+x]=GRASS;break}
  }
  const road=new Uint8Array(W*H);
  const seg=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)road[y*W+x]=1};
  seg(15,16,16,42);seg(15,16,79,17);seg(78,16,79,29);seg(15,41,81,42);seg(80,28,81,42);seg(13,27,16,28);seg(78,28,81,29);
  const add=(kind,tx,ty,w,h,hp,needLand)=>{
    for(let y=ty;y<ty+h;y++)for(let x=tx;x<tx+w;x++){const i=y*W+x;if(block[i]||road[i]||(needLand&&map[i]===WATER))return null}
    const s={kind,tx,ty,w,h,hp,max:hp,alive:true,x:(tx+w/2)*T,y:(ty+h/2)*T,a:r()*6.28,cool:1+r()*2,hasFlag:false};
    structs.push(s);
    for(let y=ty;y<ty+h;y++)for(let x=tx;x<tx+w;x++){map[y*W+x]=GRASS;block[y*W+x]=structs.length}
    return s;
  };
  add('bunker',8,27,2,2,Infinity);add('pturret',10,24,1,1,Infinity);add('pturret',10,31,1,1,Infinity);
  const towers=[[71,22],[86,19],[89,29],[85,37],[72,34],[83,25]];
  for(const[tx,ty]of towers)add('tower',tx,ty,2,2,260);
  for(const[tx,ty]of towers){add('turret',tx-2,ty-2,1,1,70);add('turret',tx+3,ty+3,1,1,70)}
  for(const[x,y]of[[73,14],[73,19],[73,39],[73,44],[44,13],[41,19],[50,38],[55,44]])add('turret',x,y,1,1,70);
  for(const[x,y]of[[76,24],[85,23],[77,33],[50,12]])add('aa',x,y,1,1,60);
  for(const[tx,ty]of towers)for(let y=ty-2;y<=ty+3;y++)for(let x=tx-2;x<=tx+3;x++){
    if(x!==tx-2&&x!==tx+3&&y!==ty-2&&y!==ty+3)continue;
    if(r()<.62)add('wall',x,y,1,1,50,true);
  }
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;if(map[i]!==GRASS||block[i])continue;
    let sh=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(map[i+dy*W+dx]===WATER)sh=true;
    if(sh)map[i]=SAND}
  for(let i=0;i<W*H;i++)if(road[i])map[i]=map[i]===WATER?BRIDGE:ROAD;
  for(const[x,y]of[[11,27],[12,27],[11,28],[12,28]])map[y*W+x]=PAD;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;if(map[i]===GRASS&&!block[i]&&r()<.085&&Math.hypot(x-12,y-28)>4)map[i]=TREE}
  const tw=structs.filter(s=>s.kind==='tower'),ft=tw[Math.floor(Math.random()*tw.length)];ft.hasFlag=true;
  flag={state:'hidden',x:ft.x,y:ft.y,hx:ft.x,hy:ft.y};towersLeft=tw.length;
  for(const[x,y]of[[46,19],[50,39],[75,18],[83,33],[76,30],[87,25],[75,40]]){const p=freeSpot(x,y);
    enemies.push({kind:'tank',x:p[0],y:p[1],hx:p[0],hy:p[1],wx:p[0],wy:p[1],wt:0,a:r()*6.28,ta:0,hp:90,max:90,cool:1})}
  buildWorld();mmDirty=true;
}
function freeSpot(tx,ty){
  for(let rad=0;rad<8;rad++)for(let y=ty-rad;y<=ty+rad;y++)for(let x=tx-rad;x<=tx+rad;x++){
    if(x<1||y<1||x>=W-1||y>=H-1)continue;const i=y*W+x,t=map[i];
    if(!block[i]&&(t===GRASS||t===SAND||t===ROAD))return[(x+.5)*T,(y+.5)*T]}
  return[tx*T,ty*T];
}
function tileAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);return tx<0||ty<0||tx>=W||ty>=H?WATER:map[ty*W+tx]}
function structAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=W||ty>=H)return null;const b=block[ty*W+tx];return b?structs[b-1]:null}
function pass(x,y,type){
  const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=W||ty>=H)return false;
  const i=ty*W+tx;if(block[i])return false;const t=map[i];
  if(t===WATER)return type!=='etank';
  if(t===TREE){if(type==='jeep')return false;map[i]=GRASS;killTree(i);mmDirty=true;puff((tx+.5)*T,(ty+.5)*T)}
  return true;
}
function canStand(x,y,r,type){const q=r*.75;return pass(x-q,y-q,type)&&pass(x+q,y-q,type)&&pass(x-q,y+q,type)&&pass(x+q,y+q,type)}

/* ---------- effects & sound ---------- */
let ac=null,nb=null,mute=false;
function initAudio(){if(ac)return;try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const n=Math.floor(ac.sampleRate*.5);nb=ac.createBuffer(1,n,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}
function snd(k){
  if(!ac||mute)return;try{const t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);
  if(k==='boom'){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(80,t+.4);
    s.connect(f);f.connect(g);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);s.start(t);s.stop(t+.5)}
  else{const o=ac.createOscillator();o.type=k==='shell'?'square':'sawtooth';const f0=k==='shell'?150:k==='rocket'?300:520;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*.4,t+.09);o.connect(g);
    g.gain.setValueAtTime(k==='gun'?.04:.11,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.11)}}catch(e){}
}
function laugh(){ // deep "mwa-ha-ha": voiced source through vowel formants, breath before each syllable, echo
  if(!ac||mute)return;try{
  const t0=ac.currentTime+.25,out=ac.createGain();out.gain.value=.9;out.connect(ac.destination);
  const dl=ac.createDelay(.5),fb=ac.createGain();dl.delayTime.value=.19;fb.gain.value=.38;out.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);
  let t=t0;
  for(let i=0;i<11;i++){
    const len=i<2?.36:.2+i*.007,d=len*.72,p=i<2?100:148-i*5,st=t;t+=len;
    const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(p*1.18,st);o.frequency.exponentialRampToValueAtTime(p*.85,st+d);
    g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(1,st+.035);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g);
    for(const fm of[[720,6,.5],[1150,8,.3],[2600,10,.1]]){const bq=ac.createBiquadFilter(),bg=ac.createGain();bq.type='bandpass';bq.frequency.value=fm[0];bq.Q.value=fm[1];bg.gain.value=fm[2];g.connect(bq);bq.connect(bg);bg.connect(out)}
    const lo=ac.createBiquadFilter(),lg=ac.createGain();lo.type='lowpass';lo.frequency.value=260;lg.gain.value=.25;g.connect(lo);lo.connect(lg);lg.connect(out);
    const n=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();n.buffer=nb;nf.type='bandpass';nf.frequency.value=1400;nf.Q.value=.8;
    ng.gain.setValueAtTime(.0001,st-.05);ng.gain.exponentialRampToValueAtTime(.12,st);ng.gain.exponentialRampToValueAtTime(.0001,st+.07);n.connect(nf);nf.connect(ng);ng.connect(out);
    n.start(st-.05);n.stop(st+.1);o.start(st);o.stop(st+d+.02);
  }}catch(e){}
}
const NOTE={};'C,C#,D,D#,E,F,F#,G,G#,A,A#,B'.split(',').forEach((n,i)=>{for(let o=1;o<7;o++)NOTE[n+o]=440*Math.pow(2,(i-9)/12+o-4)});
const BEE='E5 D#5 D5 C#5 C5 F5 E5 D#5 E5 D#5 D5 C#5 C5 C#5 D5 D#5 ',BEE2='A5 G#5 G5 F#5 F5 A#5 A5 G#5 A5 G#5 G5 F#5 F5 F#5 G5 G#5 ';
const TUNES={ // public-domain classics, one per vehicle
  heli:{u:.16,w:'sawtooth',oct:1,v:['B3:1.5 F#3:.5 B3:1 D4:3 B3:3 D4:1.5 B3:.5 D4:1 F#4:3 D4:3 F#4:1.5 D4:.5 F#4:1 A4:3 A3:3 D4:1.5 A3:.5 D4:1 F#4:6 0:3']},
  launcher:{u:.22,acc:.92,min:.085,w:'square',v:['B2 C#3 D3 E3 F#3 D3 F#3:2 F3 C#3 F3:2 E3 C3 E3:2 B2 C#3 D3 E3 F#3 D3 F#3 B3 A3 F#3 D3 F#3 A3:4']},
  jeep:{u:.075,w:'sawtooth',v:[(BEE+BEE+BEE2+BEE2).trim()]},
  tank:{u:.13,w:'sawtooth',v:['G2 G2 G2 G2:3 G2:3 G2:1.5 G2:1.5 G2:3','G3:30 D4:30 C#4:30']}
};
let mus=null;
function startMusic(k){if(!ac){mus=null;return}const t=TUNES[k];mus={t,u:t.u,vs:t.v.map(s=>({n:s.split(' ').map(x=>{const q=x.split(':');return[NOTE[q[0]]||0,+(q[1]||1)]}),i:0,at:ac.currentTime+.5}))}}
function stopMusic(){mus=null}
function tone(f,t,d,w,g){const o=ac.createOscillator(),gn=ac.createGain(),fl=ac.createBiquadFilter();o.type=w;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=Math.min(4200,f*5);
  o.connect(fl);fl.connect(gn);gn.connect(ac.destination);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+.015);gn.gain.setValueAtTime(g,t+Math.max(.02,d*.7));gn.gain.exponentialRampToValueAtTime(.0001,t+d*.98);o.start(t);o.stop(t+d)}
function tickMusic(){
  if(!mus||!ac||mute)return;try{const now=ac.currentTime;
  mus.vs.forEach((v,vi)=>{if(v.at<now)v.at=now+.05;
    while(v.at<now+.3){const f=v.n[v.i][0],d=v.n[v.i][1]*mus.u;if(f){tone(f,v.at,d,mus.t.w,.06);if(mus.t.oct)tone(f*2,v.at,d,mus.t.w,.025)}
      v.at+=d;if(++v.i>=v.n.length){v.i=0;if(vi===0&&mus.t.acc)mus.u=Math.max(mus.t.min,mus.u*mus.t.acc)}}})}catch(e){}
}
function boom(x,y,s,h,quiet){
  const n=Math.floor(5+s*10);if(h===undefined)h=G+6;

    skCam.position.set(0,0,vw<vh?9:7);skCam.lookAt(0,vw<vh?-1.5:-.9,0);
    renderer.render(skScene,skCam);return;
  }
  const p=player,fly=!!(p&&V[p.type].fly);
  cam.z+=((fly?1.2:1)-cam.z)*Math.min(1,dt*3);
  if(p){cam.x+=(p.x+Math.cos(p.a)*30-cam.x)*Math.min(1,dt*6);cam.y+=(p.y+Math.sin(p.a)*30-cam.y)*Math.min(1,dt*6)}
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*20)}
  const D=baseD*cam.z,tx=clamp(cam.x,120,W*T-120)+sx,tz=clamp(cam.y,120,H*T-120)-50+sy;
  if(orbit)camTh+=dt*.14;else{camTh=adiff(camTh,0);camTh-=camTh*Math.min(1,dt*3)}
  camE+=((orbit?.45:.7)-camE)*Math.min(1,dt*3);const cr=Math.sqrt(1-camE*camE);
  camera.position.set(tx+Math.sin(camTh)*D*cr,D*camE,tz+Math.cos(camTh)*D*cr);camera.lookAt(tx,0,tz);
  if(seaMat&&seaMat.normalMap){seaMat.normalMap.offset.x+=dt*.012;seaMat.normalMap.offset.y+=dt*.007}
  for(const l of fl)l.intensity=Math.max(0,l.intensity-dt*8);
  for(let i=collapsing.length-1;i>=0;i--){const c=collapsing[i];c.t+=dt;c.g.position.y-=42*dt;c.g.rotation.z+=.22*dt;c.g.rotation.x+=.1*dt;if(c.t>1.25){world.remove(c.g);collapsing.splice(i,1)}}
  for(let i=0;i<dPool.length;i++){const m=dPool[i],d=debris[i];m.visible=!!d;if(d){m.position.set(d.x,d.h+d.s*.4,d.y);m.rotation.set(d.rx,0,d.rz);m.scale.setScalar(d.s*Math.min(1,d.life))}}
  const rj=myFlag.state==='stolen'&&enemies.find(e=>e.kind==='jeep'&&e.has);
  if(rj)myFlagMesh.position.set(rj.x,(tileAt(rj.x,rj.y)===WATER?-3:G)+8,rj.y);else myFlagMesh.position.set(MFX,G,MFY);
  sun.position.set(tx-320,620,tz+260);sun.target.position.set(tx,0,tz);sun.target.updateMatrixWorld();
  for(const k in pMesh)pMesh[k].visible=false;wake.visible=false;
  let py=G;
  if(p){const m=pMesh[p.type];m.visible=true;py=fly?G+FH:p.sink?-2-p.sink*16:p.wet?-3:Math.max(1,hAt(p.x,p.y));
    m.position.set(p.x,py,p.y);m.rotation.y=-p.a;p.bank=(p.bank||0)+((p.tb||0)-(p.bank||0))*Math.min(1,dt*5);p.pit=(p.pit||0)+((p.tm||0)-(p.pit||0))*Math.min(1,dt*4);
    m.rotation.x=fly?p.bank*.5:0;m.rotation.z=p.sink?p.sink*.35:fly?-p.pit*.2:0;
    if(m.userData.turret)m.userData.turret.rotation.y=-(p.ta-p.a);
    if(m.userData.rotor)m.userData.rotor.rotation.y+=dt*28;
    if(p.wet){wake.visible=true;wake.position.set(p.x,.4,p.y);wake.scale.setScalar(1+.25*Math.sin(time*8))}}
  for(const s of structs)if(s.alive&&s.head)s.head.rotation.y=-s.a;
  for(const e of enemies){
    if(!e.mesh){e.mesh=mkVeh(e.kind,EC);world.add(e.mesh)}
    const dr=e.kind==='drone';e.mesh.position.set(e.x,dr?G+FH:tileAt(e.x,e.y)===WATER?-3:Math.max(1,hAt(e.x,e.y)),e.y);e.mesh.rotation.y=-e.a;
    if(dr)e.mesh.userData.rotor.rotation.y+=dt*28;else if(e.mesh.userData.turret)e.mesh.userData.turret.rotation.y=-(e.ta-e.a);
  }
  for(let i=0;i<bPool.length;i++){const m=bPool[i],b=bullets[i];if(!b){m.visible=false;continue}
    m.visible=true;m.material=BM[b.k===2?(b.own?3:2):b.own?3:b.k];m.position.set(b.x,b.h,b.y);const bs=b.k===0?1.5:b.k===2?3.2:2.4;m.scale.set(bs*(b.k===1?1.6:3.5),bs,bs);m.rotation.y=-Math.atan2(b.vy,b.vx)}
  for(let i=0;i<qPool.length;i++){const m=qPool[i],q=parts[i];if(!q){m.visible=false;continue}
    const t=Math.max(0,q.life/q.max),mt=m.material;m.visible=true;m.position.set(q.x,q.h,q.y);
    if(q.k===0){mt.blending=THREE.AdditiveBlending;mt.color.setRGB(1,.35+.5*t,.1+.3*t);mt.opacity=Math.min(1,t*1.6);m.scale.setScalar(q.r*(2.2+(1-t)*2.5))}
    else if(q.k===1){mt.blending=THREE.NormalBlending;mt.color.setRGB(.17,.165,.155);mt.opacity=.6*t;m.scale.setScalar(q.r*(2.5+(1-t)*4))}
    else{mt.blending=THREE.NormalBlending;mt.color.setRGB(.9,.88,.83);mt.opacity=.4*t;m.scale.setScalar(q.r*(2+(1-t)*3))}}
  for(let i=0;i<mPool.length;i++){const m=mPool[i],q=mines[i];m.visible=!!q;if(q)m.position.set(q.x,Math.max(1,hAt(q.x,q.y))+1.5,q.y)}
  const st=flag.state;fMesh.visible=st!=='hidden';ring.visible=st==='ground';
  if(st==='ground'){const fy=Math.max(1,hAt(flag.x,flag.y));fMesh.position.set(flag.x,fy,flag.y);ring.position.set(flag.x,fy+1,flag.y);ring.scale.setScalar(1+.15*Math.sin(time*5))}
  else if(st==='carried'&&p)fMesh.position.set(p.x-Math.cos(p.a)*6,py+8,p.y-Math.sin(p.a)*6);
  else if(st==='home')fMesh.position.set(PADX-40,G,PADY+50);
  fMesh.userData.pen.rotation.y=Math.sin(time*6)*.25;
  renderer.render(scene,camera);
}
function drawIcon(c,type){ // flat 2D silhouette for the vehicle cards
  const col=PC;c.rotate(-.45);
  if(type==='tank'){c.fillStyle='#1d2224';c.fillRect(-14,-11,28,5);c.fillRect(-14,6,28,5);c.fillStyle=col.b;c.fillRect(-12,-8,24,16);c.fillStyle=col.l;c.fillRect(-9,-6,16,12);
    c.fillStyle=col.d;c.fillRect(2,-2,18,4);c.fillStyle=col.b;c.beginPath();c.arc(0,0,6.5,0,7);c.fill()}
  else if(type==='launcher'){c.fillStyle='#1d2224';for(const s of[-1,1])for(const wx of[-10,0,10])c.fillRect(wx-4,s*9-2.5,8,5);
    c.fillStyle=col.b;c.fillRect(-14,-8,28,16);c.fillStyle=col.l;c.fillRect(5,-6,7,12);c.fillStyle=col.d;c.fillRect(-12,-7,15,14);c.fillStyle='#e9e2cf';for(const yy of[-4.5,-1.5,1.5,4.5])c.fillRect(-10,yy-.8,11,1.6)}
  else if(type==='jeep'){c.fillStyle='#1d2224';for(const sx of[-7,7])for(const sy of[-7,7])c.fillRect(sx-3,sy-2,6,4);
    c.fillStyle=col.b;c.fillRect(-10,-6,20,12);c.fillStyle=col.d;c.fillRect(2,-5,3,10);c.fillStyle=col.l;c.fillRect(-8,-4,8,8)}
  else{c.fillStyle=col.d;c.fillRect(-20,-1.5,14,3);c.fillRect(-22,-5,3,10);c.fillStyle=col.b;c.beginPath();c.ellipse(0,0,11,6.5,0,0,7);c.fill();
    c.fillStyle='#cfe6f2';c.beginPath();c.arc(5,0,4,0,7);c.fill();c.rotate(.8);c.strokeStyle='#1d2224';c.lineWidth=2;c.beginPath();c.moveTo(-19,0);c.lineTo(19,0);c.moveTo(0,-19);c.lineTo(0,19);c.stroke()}
}
function drawMM(){
  if(mmDirty){mmDirty=false;const im=mmBc.createImageData(W,H),d=im.data;
    const col={0:[23,82,92],1:[120,134,66],2:[207,185,128],3:[178,160,126],4:[150,118,80],5:[60,100,58],6:[110,106,92],7:[111,155,212]};
    for(let i=0;i<W*H;i++){const c=block[i]?[70,72,66]:col[map[i]];d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255}
    mmBc.putImageData(im,0,0)}
  const c=mmc;c.imageSmoothingEnabled=false;c.drawImage(mmB,0,0,192,112);
  c.fillStyle='#e0563c';for(const s of structs)if(s.alive&&s.kind==='tower')c.fillRect(s.tx*2,s.ty*2,4,4);
  c.fillStyle='#6f9bd4';c.fillRect(PADX/T*2-3,PADY/T*2-3,6,6);
  for(const e of enemies)if(e.kind==='jeep'&&Math.sin(time*10)>0){c.fillStyle='#ff3b1f';c.fillRect(e.x/T*2-3,e.y/T*2-3,6,6)}
  const bl=Math.sin(time*8)>0;
  if(flag.state==='ground'&&bl){c.fillStyle='#f0c24a';c.fillRect(flag.x/T*2-3,flag.y/T*2-3,6,6)}
  if(player){c.fillStyle=player.flag&&bl?'#f0c24a':'#ffffff';c.fillRect(player.x/T*2-2,player.y/T*2-2,5,5)}
}
function hud(){
  const p=player;if(!p)return;const v=V[p.type];
  const hp=$('hpB'),fu=$('fuB');hp.style.width=Math.max(0,p.hp/v.hp*100)+'%';hp.className=p.hp<v.hp*.3?'low':'';
  fu.style.width=Math.max(0,p.fuel/v.fuel*100)+'%';fu.className=p.fuel<v.fuel*.25?'low':'';
  $('ammo').textContent=p.ammo;if(p.type==='launcher')$('mineN').textContent=p.mines;
}

/* ---------- flow ---------- */
const cardEls={};
function buildCards(){
  for(const k of['heli','tank','launcher','jeep']){
    const b=document.createElement('button');b.type='button';b.className='card';b.id='card-'+k;
    const ic=document.createElement('canvas');ic.width=112;ic.height=88;const c=ic.getContext('2d');c.setTransform(2.4,0,0,2.4,56,44);drawIcon(c,k);
    const nm=document.createElement('b');nm.textContent=V[k].name;const n=document.createElement('span');nm.appendChild(n);
    const sm=document.createElement('small');sm.textContent=V[k].role;
    b.append(ic,nm,sm);b.addEventListener('click',()=>launch(k));$('cards').appendChild(b);cardEls[k]={b,n};
  }
}
function openMenu(kind){
  const end=kind==='win'||kind==='lose';mode=end?'over':'menu';stopMusic();orbit=kind==='start'||kind==='win';winFx=kind==='win'?12:0;
  const tx={
    start:['תפוס את הדגל · שחקן יחיד','מבצע דגל',"דגל האויב מוסתר באחד משישה מבצרים באי המזרחי. פוצץ מבצרים עד שהוא נחשף, אסוף אותו בג'יפ והחזר אותו לבונקר. שים לב: גם האויב שולח ג'יפים לגנוב את הדגל שלך."],
    dock:['בבונקר','בחר כלי','הכלי תוקן, תודלק וחזר למלאי.'],
    lost:['כלי אבד','ה'+lostName+' '+lostVerb,'בחר כלי אחר והמשך במבצע.'],
    win:['ניצחון','הדגל בידינו','המבצע הושלם תוך '+Math.floor(playT/60)+':'+String(Math.floor(playT%60)).padStart(2,'0')+' דקות.'],
    lose:['תבוסה','המבצע נכשל',loseWhy==='flag'?'האויב הביא את הדגל שלך לבסיס שלו.':"לא נשארו ג'יפים, ואין מי שיישא את הדגל."]
  }[kind];
  $('mEy').textContent=tx[0];$('mT').textContent=tx[1];$('mS').textContent=tx[2];
  const f=$('mF');f.hidden=end||kind==='start';
  f.textContent=flag.state==='ground'?"הדגל חשוף בשטח ומסומן בצהוב במפה. שלח ג'יפ.":'נותרו '+towersLeft+' מבצרים לבדיקה.';
  $('cards').hidden=end;$('again').hidden=!end;
  for(const k in cardEls){cardEls[k].n.textContent='×'+fleet[k];cardEls[k].b.disabled=fleet[k]<1}
  const was=skullOn;skullOn=kind==='lose';$('menu').classList.toggle('end',skullOn);if(skullOn&&!was){skT=0;laugh()}
  $('menu').hidden=false;$('hud').hidden=true;$('ctl').hidden=true;$('msg').classList.remove('on');
}
let skullNext='lost',lostVerb='הושמד';
function startSkull(next){
  stopMusic();skullNext=next;mode='skull';skullOn=true;skT=0;laugh();
  $('hud').hidden=true;$('ctl').hidden=true;say('ה'+lostName+' '+lostVerb,2.8);
}
function launch(type){
  if(fleet[type]<1)return;initAudio();if(ac&&ac.state==='suspended')ac.resume();
  fleet[type]--;const v=V[type];fuelWarn=false;
  player={isP:true,type,x:PADX,y:PADY,a:0,ta:0,hp:v.hp,fuel:v.fuel,ammo:v.ammo,mines:v.mines||0,cool:0,flag:false,left:false,wet:false};
  mode='play';orbit=false;startMusic(type);$('menu').hidden=true;$('hud').hidden=false;$('ctl').hidden=false;$('bMine').hidden=type!=='launcher';
  $('vName').textContent=v.name;hud();
  if(playT<1)say('האי של האויב במזרח. המבצרים מסומנים באדום במפה.',5);
}
function reset(){
  bullets=[];parts=[];mines=[];player=null;alarm=false;deadT=0;playT=0;shake=0;
  myFlag={state:'home'};raidT=55;loseWhy='jeeps';debris.length=0;fires.length=0;collapsing.length=0;
  fleet={heli:2,tank:3,launcher:2,jeep:3};gen();cam.x=PADX;cam.y=PADY;openMenu('start');
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{key[e.code]=true;if(e.code==='KeyM'||e.code==='KeyE')mineReq=true;
  if(mode==='play'&&(e.code==='Space'||e.code.startsWith('Arrow')))e.preventDefault()});
addEventListener('keyup',e=>{key[e.code]=false});
addEventListener('blur',()=>{for(const k in key)key[k]=false;fireBtn=false;firePtr=null;joyEnd()});
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,r.width]}
function joyEnd(){joy.id=null;$('joy').hidden=true}
cv.addEventListener('pointerdown',e=>{
  if(mode==='skull'&&skT>.6){openMenu(skullNext);return}
  if(mode!=='play')return;const[x,y,w]=pt(e);
  if(x<w*.6&&joy.id===null){joy.id=e.pointerId;joy.ox=x;joy.oy=y;joy.vx=joy.vy=0;const j=$('joy');j.hidden=false;j.style.left=x+'px';j.style.top=y+'px';$('knob').style.transform=''}
  else if(firePtr===null)firePtr=e.pointerId;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;const[x,y]=pt(e);let dx=(x-joy.ox)/46,dy=(y-joy.oy)/46;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}joy.vx=dx;joy.vy=dy;
  $('knob').style.transform='translate('+dx*46+'px,'+dy*46+'px)'});
const pend=e=>{if(e.pointerId===joy.id)joyEnd();if(e.pointerId===firePtr)firePtr=null};
cv.addEventListener('pointerup',pend);cv.addEventListener('pointercancel',pend);
cv.addEventListener('contextmenu',e=>e.preventDefault());
const bf=$('bFire');
bf.addEventListener('pointerdown',e=>{fireBtn=true;bf.classList.add('down');try{bf.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
for(const ev of['pointerup','pointercancel'])bf.addEventListener(ev,()=>{fireBtn=false;bf.classList.remove('down')});
$('bMine').addEventListener('pointerdown',e=>{mineReq=true;e.preventDefault()});
$('again').addEventListener('click',reset);
$('snd').addEventListener('click',()=>{mute=!mute;$('snd').textContent=mute?'צליל כבוי':'צליל פועל';$('snd').setAttribute('aria-pressed',String(!mute))});

function resize(){
  vw=cv.clientWidth||800;vh=cv.clientHeight||600;const asp=vw/vh;
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.setSize(vw,vh,false);
  camera.fov=asp<1?50:40;camera.aspect=asp;camera.updateProjectionMatrix();skCam.aspect=asp;skCam.updateProjectionMatrix();
  baseD=clamp(200/(Math.tan(camera.fov*Math.PI/360)*asp),480,1100);
  fit3D();
}
addEventListener('resize',resize);
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  let gdt=dt;if(slowT>0){slowT-=dt;gdt=dt*.3}
  if(mode==='play'){update(gdt);hud();tickMusic()}else{time+=dt;updFx(dt)}
  if(winFx>0){winFx-=dt;if(Math.random()<dt*3)boom(PADX+(Math.random()-.5)*300,PADY+(Math.random()-.5)*300,1.3,G+70+Math.random()*80,true)}
  if(mode==='skull'&&skT>3)openMenu(skullNext);
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').classList.remove('on')}
  render(dt);mmT-=dt;if(mmT<=0&&mode==='play'){mmT=.12;drawMM()}
  requestAnimationFrame(frame);
}
buildCards();
try{init3D();resize();reset();requestAnimationFrame(frame)}
catch(err){$('mT').textContent='לא ניתן להפעיל תלת ממד';$('mS').textContent='הדפדפן או המכשיר לא תומכים ב-WebGL, שהמשחק צריך כדי לצייר את הזירה.'}
</script>
