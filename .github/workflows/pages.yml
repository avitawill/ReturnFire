# Tests, builds and publishes the game to GitHub Pages on every push to the default branch.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
# Optional: Settings > Secrets and variables > Actions > Variables > RELAY_URL (wss://...) for online play.
name: Publish game

on:
  push:
    branches: [main, claude/new-session-l12gm7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
